<messages>
    {% if messages %}
    <div x-data="{ showMessage: false }" >
    {% for message in messages %}
    <div class="fixed top-4 left-1/2 transform -translate-x-1/2 max-w-md mx-auto px-4 z-50">
        <div x-cloak 
             class="flex items-center py-4 px-6 rounded-xl shadow-2xl border-2 backdrop-blur-sm"
             :class="{
                 'bg-green-900 border-green-500 text-green-100': '{{ message.tags }}' === 'success',
                 'bg-red-900 border-red-500 text-red-100': '{{ message.tags }}' === 'error' || '{{ message.tags }}' === 'danger',
                 'bg-yellow-900 border-yellow-500 text-yellow-100': '{{ message.tags }}' === 'warning',
                 'bg-blue-900 border-blue-500 text-blue-100': '{{ message.tags }}' === 'info' || '{{ message.tags }}' === 'debug'
             }"
             role="alert"
             x-show="showMessage" 
             x-init="setTimeout(() => showMessage = true, 200), setTimeout(() => showMessage = false, 8000)"
             x-transition:enter="duration-500 ease-out"
             x-transition:enter-start="opacity-0 -translate-y-8 scale-95"
             x-transition:enter-end="opacity-100 translate-y-0 scale-100"
             x-transition:leave="duration-300 ease-in"
             x-transition:leave-start="opacity-100 translate-y-0 scale-100"
             x-transition:leave-end="opacity-0 -translate-y-8 scale-95">
            
            <!-- Icon -->
            <div class="flex-shrink-0 mr-4">
                <div x-show="'{{ message.tags }}' === 'success'">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div x-show="'{{ message.tags }}' === 'error' || '{{ message.tags }}' === 'danger'">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div x-show="'{{ message.tags }}' === 'warning'">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.725-1.36 3.49 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div x-show="'{{ message.tags }}' === 'info' || '{{ message.tags }}' === 'debug'">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                    </svg>
                </div>
            </div>
            
            <!-- Message Content -->
            <div class="flex-1">
                <div class="text-sm font-semibold">
                    <span x-show="'{{ message.tags }}' === 'success'">Success!</span>
                    <span x-show="'{{ message.tags }}' === 'error' || '{{ message.tags }}' === 'danger'">Error!</span>
                    <span x-show="'{{ message.tags }}' === 'warning'">Warning!</span>
                    <span x-show="'{{ message.tags }}' === 'info' || '{{ message.tags }}' === 'debug'">Info</span>
                </div>
                <div class="text-sm mt-1">{{ message }}</div>
            </div>
            
            <!-- Close Button -->
            <div class="ml-4 flex-shrink-0">
                <button @click="showMessage = false" class="inline-flex text-current hover:opacity-75 focus:outline-none focus:opacity-75 transition-opacity duration-200">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
        </div> 
    </div>
    {% endfor %}
    </div>
    {% endif %}
</messages>
